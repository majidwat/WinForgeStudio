[package]
name = "winforge-studio"
version = "0.2.0"
edition = "2021"
description = "Modern Windows system utility built with Rust and Slint"
license = "MIT"

[dependencies]
slint = { version = "1.8", features = ["backend-winit", "renderer-software"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
