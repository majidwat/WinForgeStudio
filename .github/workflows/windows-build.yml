name: Windows Build and Package
concurrency:
  group: winforge-build-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        timeout-minutes: 2
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Build native Rust Slint application
        run: cargo build --release
      - name: Package portable Rust application
        run: .\package.ps1
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WinForgeStudio-portable
          path: target/release/WinForgeStudio-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: WinForgeStudio-windows
          path: target/release/winforge-studio.exe
          if-no-files-found: error
          retention-days: 14
